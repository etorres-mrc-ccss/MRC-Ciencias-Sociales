u empleo; 50 jóvenes buscan su primer empleo.", "Justifica tus prioridades ante una automatización o recesión.", [["Una máquina exige nuevas competencias. ¿Qué desempleo puede resultar?", "Estructural", "Friccional", "Estacional", "Voluntario necesariamente"], ["Una persona busca empleo durante una transición breve.", "Friccional", "Estructural", "Cíclico", "Inflacionario"], ["Una recesión reduce la demanda laboral.", "Desempleo cíclico", "Desempleo friccional", "Pleno empleo", "Inflación por demanda"], ["¿Qué mide el crecimiento económico?", "Aumento de producción real", "Igualdad de ingresos", "Felicidad de todos", "Empleo garantizado"], ["¿Qué ayuda a enfrentar la falta de competencias?", "Capacitación pertinente", "Eliminar toda inversión", "Reducir educación", "Ignorar cambios tecnológicos"]]], ["Sistema financiero", "Rosa necesita S/ 3000. A anuncia S/ 3600 y B S/ 3420 en 12 meses; cargos no especificados.", "¿Qué información exigirías antes de elegir?", [["Costo adicional anunciado de A", "600", "420", "300", "3600"], ["Cuota promedio anunciada de B", "285", "300", "420", "342"], ["¿Qué indicador compara el costo efectivo anual del crédito?", "TCEA", "PBI", "IDH", "PNB"], ["¿Qué institución supervisa entidades bancarias peruanas?", "SBS", "INEI", "BID", "PNUD"], ["¿Qué debe hacer Rosa antes de firmar?", "Verificar cargos y capacidad de pago", "Elegir solo por publicidad", "Ignorar seguros", "Suponer que las ventas nunca caen"]]], ["Globalización económica", "Cacao: 1000 unidades; precio nacional S/ 12, internacional S/ 17; producción S/ 8; gastos adicionales S/ 1 y S/ 5 respectivamente.", "¿Cómo reducirías la dependencia de un comprador?", [["Beneficio nacional inicial", "3000", "12000", "9000", "4000"], ["Beneficio internacional inicial", "4000", "17000", "13000", "5000"], ["Si transporte internacional sube S/ 2 por unidad, beneficio internacional", "2000", "6000", "4000", "0"], ["¿Qué es deslocalización empresarial?", "Trasladar actividades productivas a otro lugar", "Eliminar todo comercio", "Aumentar aranceles", "Cerrar todas las empresas"], ["¿Qué reduce dependencia comercial?", "Diversificar compradores", "Depender de un solo cliente", "Ignorar contratos", "Eliminar controles de calidad"]]], ["Comercio internacional", "País Andino: alimentos 10, equipos 30. País Tecnológico: alimentos 16, equipos 20. Monedas equivalentes.", "Propón condiciones para proteger consumidores y productores.", [["¿Qué país ofrece alimentos más baratos?", "Andino", "Tecnológico", "Ambos igual", "Ninguno"], ["Equipo importado de 20 con arancel 20 %, sin otros gastos", "24", "40", "20", "30"], ["¿Qué es un arancel?", "Tributo sobre importaciones", "Salario", "Préstamo", "Subsidio necesariamente"], ["¿Qué añade una unión aduanera a una zona de libre comercio?", "Arancel externo común", "Moneda única obligatoria", "Prohibición de exportar", "Eliminación de gobiernos"], ["¿Qué registra la balanza de pagos?", "Transacciones económicas con el exterior", "Solo exportaciones de bienes", "Solo impuestos locales", "Solo salarios"]]], ["Desarrollo humano", "Progreso: PBI S/ 200 millones, agua 65 %, secundaria 70 %, pobreza 35 %, crecimiento 6 %. Bienestar: S/ 150 millones, agua 95 %, secundaria 95 %, pobreza 12 %, crecimiento 3 %. Ambas: 10 000 habitantes.", "Justifica inversiones y explica qué información falta para medir el IDH.", [["PBI per cápita de Progreso", "20000", "15000", "2000", "200000"], ["PBI per cápita de Bienestar", "15000", "20000", "1500", "150000"], ["¿Qué ciudad tiene mejores indicadores sociales mostrados?", "Bienestar", "Progreso", "Ambas iguales", "No hay indicadores sociales"], ["Dimensiones del IDH", "Salud, educación e ingreso", "Agua, exportaciones y aranceles", "PBI, inflación y desempleo", "Solo ingreso"], ["¿Se puede calcular directamente el IDH con estos datos?", "No, faltan indicadores requeridos", "Sí, solo con PBI", "Sí, solo con agua", "Sí, solo con pobreza"]]]];let idx=0,started,records=[],order=[];const $=id=>document.getElementById(id);function begin(){if(!$('student').value.trim())return alert('Ingresa tu código');started=Date.now();$('start').hidden=true;$('work').hidden=false;render()}function fields(names,vals,max=1000){return names.map((n,i)=>`<label>${n} <input type="number" min="0" max="${max}" step="1" id="v${i}" value="${vals[i]}" oninput="calc()"></label>`).join('')}function sim(){switch(idx){case 0:return fields(['Ingreso adicional','Ahorro de gastos'],[0,0])+`<label>Evento <select id="event" onchange="calc()"><option value="0">Ninguno</option><option value="-40">Transporte +40</option><option value="150">Trabajo temporal +150</option><option value="-120">Salud +120</option><option value="100">Ahorro comunitario +100</option></select></label>`;case 1:return fields(['Capacitación','Infraestructura','Innovación','Emprendimientos','Empleo'],[2,2,2,2,2],10);case 2:return fields(['Cargos adicionales A','Cargos adicionales B','Capacidad mensual de pago'],[0,0,300],10000);case 3:return fields(['Precio internacional','Gastos adicionales internacionales por unidad'],[17,5],100);case 4:return fields(['Arancel sobre equipo importado (%)'],[20],100);case 5:return fields(['Educación','Salud','Agua y saneamiento','Infraestructura productiva','Empleo'],[2,2,2,2,2],10)}}function vals(){return [...document.querySelectorAll('#sim input')].map(x=>Number(x.value))}function calc(){let v=vals(),s=v.reduce((a,b)=>a+b,0),t='';switch(idx){case 0:t='Saldo familiar: S/ '+(2000+v[0]-2030+v[1]+Number($('event').value));break;case 1:case 5:t='Fichas asignadas: '+s+'/10. '+(s===10?'Presupuesto completo.':'Ajusta la distribución.')+' Las fichas no garantizan resultados automáticos.';break;case 2:t=`Cuota A: S/ ${((3600+v[0])/12).toFixed(2)} · B: S/ ${((3420+v[1])/12).toFixed(2)}. Capacidad: S/ ${v[2]}. No equivale a calcular la TCEA.`;break;case 3:t='Beneficio nacional: S/ 3000 · Internacional: S/ '+(1000*(v[0]-8-v[1]));break;case 4:t='Precio importado con arancel: '+(20*(1+v[0]/100)).toFixed(2)+' monedas; precio local: 30.';break}$('out').textContent=t}function render(){let m=M[idx];$('nav').innerHTML=M.map((x,i)=>`<button disabled>${i+1}${i<idx?' ✓':''}</button>`).join('');order=m[3].map(q=>q.slice(1).sort(()=>Math.random()-.5));$('panel').innerHTML=`<section><small>MISIÓN ${idx+1} DE 6</small><h2>${m[0]}</h2><p>${m[1]}</p><h3>Experimenta</h3><div id="sim">${sim()}</div><output id="out"></output><label>${m[2]}<textarea id="argument" required></textarea></label></section><section><h3>Comprueba tus aprendizajes</h3>${m[3].map((q,i)=>`<fieldset><legend>${i+1}. ${q[0]}</legend>${order[i].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</fieldset>`).join('')}<button id="submit" onclick="grade()">Comprobar misión</button><div id="feedback"></div></section>`;calc();window.scrollTo(0,0)}function grade(){let selected=M[idx][3].map((q,i)=>document.querySelector(`input[name=q${i}]:checked`));if(selected.some(x=>!x)||!$('argument').value.trim())return alert('Responde todas las preguntas y argumenta.');if([...document.querySelectorAll('#sim input')].some(x=>!x.checkValidity()))return alert('Revisa los valores de la simulación.');if([1,5].includes(idx)&&vals().reduce((a,b)=>a+b,0)!==10)return alert('Distribuye exactamente diez fichas.');let m=M[idx],answers=selected.map((x,i)=>order[i][Number(x.value)]),score=answers.filter((a,i)=>a===m[3][i][1]).length;records.push({mission:idx+1,score,answers,argument:$('argument').value,simulation:JSON.stringify({values:vals(),event:$('event')?.value,result:$('out').textContent}),seconds:Math.round((Date.now()-started)/1000)});$('submit').disabled=true;document.querySelectorAll('#panel input,#panel textarea,#panel select').forEach(x=>x.disabled=true);$('feedback').innerHTML=`<h3>${score}/5</h3>${m[3].map((q,i)=>`<p>${answers[i]===q[1]?'✓':'✗'} ${q[0]} — Respuesta esperada: ${q[1]}</p>`).join('')}<button onclick="next()">${idx===5?'Ver resultados':'Siguiente misión'}</button>`}function next(){if(idx<5){idx++;render()}else{$('work').hidden=true;$('result').hidden=false;$('result').innerHTML='<h2>Resultados</h2><h3>'+records.reduce((a,r)=>a+r.score,0)+'/30</h3>'+records.map(r=>'<p>Misión '+r.mission+': '+r.score+'/5</p>').join('')+'<p>Las argumentaciones requieren revisión docente.</p><button onclick="download()">Descargar CSV</button>';window.scrollTo(0,0)}}function download(){let rows=[['codigo','mision','pregunta','respuesta','correcta','acierto','argumentacion','simulacion','segundos_acumulados']];records.forEach(r=>r.answers.forEach((a,i)=>rows.push([$ ('student').value,r.mission,M[r.mission-1][3][i][0],a,M[r.mission-1][3][i][1],Number(a===M[r.mission-1][3][i][1]),r.argument,r.simulation,r.seconds])));let csv=rows.map(r=>r.map(v=>{let s=String(v);if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='resultados_economia.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></html>
